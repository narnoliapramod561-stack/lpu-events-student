<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fc" />

    <!-- Default Theme Initialization (Light Mode Default) -->
    <script>
      (function() {
        try {
          var initialized = localStorage.getItem('theme_initialized_v2');
          if (!initialized) {
            localStorage.setItem('theme_initialized_v2', 'true');
            localStorage.setItem('theme', 'light');
            document.documentElement.classList.remove('dark');
            return;
          }
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Critical Above-the-Fold Pre-paint Styles (Zero FOUC, Sub-300ms FCP & LCP) -->
    <style>
      body {
        margin: 0;
        background-color: #f2f5f9;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #0f172a;
        overflow-x: hidden;
      }
      .dark body, html.dark body {
        background-color: #08090f;
        color: #f8fafc;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }
      .dark .glass-nav, html.dark .glass-nav {
        background: rgba(10, 13, 20, 0.92);
        border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }
      .dark .glass-panel, html.dark .glass-panel {
        background: rgba(15, 20, 32, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .text-primary { color: #ff6b00; }
      @keyframes app-spin { to { transform: rotate(360deg); } }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f2f5f9;
        z-index: 9999;
      }
      .dark #app-splash, html.dark #app-splash {
        background-color: #08090f;
      }
      .dark #app-splash .splash-title, html.dark #app-splash .splash-title {
        color: #f8fafc !important;
      }
    </style>

        })(window,document,'script','dataLayer','GTM-5XHHNRKM');

        // Load gtag.js
