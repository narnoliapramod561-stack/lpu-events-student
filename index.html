    <!-- Default Theme Initialization (Light Mode Default) -->
    <script>
      (function() {
        try {
          var initialized = localStorage.getItem('theme_initialized_v2');
          if (!initialized) {
            localStorage.setItem('theme_initialized_v2', 'true');
            localStorage.setItem('theme', 'light');
            document.documentElement.classList.remove('dark');
            return;
          }
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

        if (analyticsInitialized) return;

        var events = ['pointerdown', 'touchstart', 'scroll', 'keydown'];

        })(window,document,'script','dataLayer','GTM-5XHHNRKM');

        // Load gtag.js

        gtScript.async = true;
        gtScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-HXC7S26FSN';
        document.head.appendChild(gtScript);
        gtag('js', new Date());
        gtag('config', 'G-HXC7S26FSN');
      }

      var interactionEvents = ['pointerdown', 'touchstart', 'scroll', 'keydown'];
      interactionEvents.forEach(function(e) {
        window.addEventListener(e, loadAnalytics, { passive: true, once: true });
      });
    </script>
