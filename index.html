    <!-- Default Theme Initialization (Light Mode Default) -->
    <script>
      (function() {
        try {
          var initialized = localStorage.getItem('theme_initialized_v2');
          if (!initialized) {
            localStorage.setItem('theme_initialized_v2', 'true');
            localStorage.setItem('theme', 'light');
            document.documentElement.classList.remove('dark');
            return;
          }
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Measure & Lock Stable Viewport Height (Eliminates address bar scroll shift on mobile) -->
    <script>
      (function() {
        function setStableHeight() {
          var h = window.innerHeight;
          if (window.screen && window.screen.height) {
            h = Math.max(h, window.screen.height);
          }
          document.documentElement.style.setProperty('--stable-screen-h', h + 'px');
        }
        setStableHeight();
        window.addEventListener('orientationchange', function() {
          setTimeout(setStableHeight, 150);
        }, { passive: true });
      })();
    </script>

    <!-- Ultra-Low Latency Early Edge Prefetch: runs in parallel with JS downloading -->
    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase();
          var isHome = p === '/' || p === '' || window.location.search.indexOf('page=home') !== -1;
          if (isHome) {
            var rawCached = null;
            var storedEtag = null;
            try {
              var item = localStorage.getItem('lpu_cache_v1_public:homepage:bundle:v2');
              if (item) {
                var parsed = JSON.parse(item);
                if (parsed && parsed.data) {
                  rawCached = parsed.data;
                  if (parsed.version) storedEtag = String(parsed.version);
                }
              }
            } catch(e) {}

            var fetchHeaders = { 'Accept': 'application/json' };
            if (storedEtag) {
              fetchHeaders['If-None-Match'] = storedEtag;
            }

            window.__PREFETCHED_HOMEPAGE__ = fetch('/api/public/homepage', {
              headers: fetchHeaders,
              cache: 'no-cache'
            }).then(function(res) {
              if (res.status === 304 && rawCached) {
                return { notModified: true, data: rawCached };
              }
              if (res.ok) {
                var etag = res.headers.get('etag');
                return res.json().then(function(data) {
                  return { notModified: false, data: data, etag: etag };
                });
              }
              return rawCached ? { notModified: true, data: rawCached } : null;
            }).then(function(result) {
              if (result && result.data) {
                var data = result.data;
                try {
                  var firstSlide = (data.carousel && data.carousel[0]) || (data.featured && data.featured[0]);
                  var imgUrl = null;
                  if (firstSlide) {
                    var evt = firstSlide.events || firstSlide;
                    var mediaId = evt.banner_media_id || (evt.media_assets && evt.media_assets.id);
                    if (mediaId) {
                      imgUrl = 'https://images.lpuevents.live/public-content/' + mediaId + '.webp';
                    } else if (firstSlide.custom_image_url) {
                      imgUrl = firstSlide.custom_image_url;
                    }
                  }
                  if (imgUrl) {
                    var preloadImg = new Image();
                    if ('fetchPriority' in preloadImg) preloadImg.fetchPriority = 'high';
                    preloadImg.src = imgUrl;
                  }
                } catch(e) {}
              }
              return result;
            }).catch(function() {
              return rawCached ? { notModified: true, data: rawCached } : null;
            });
          }
        } catch(e) {}
      })();
    </script>

      (function() {

        // Non-homepage routes (about, privacy, terms, event-details) skip startup shell completely

          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
          window.__LPU_STARTUP__ = {
            isHome: false,
            status: 'REVEALED',
            notifyCriticalReady: function() {}
          };
          return;
        }

        var startTime = Date.now();
        var MIN_VISUAL_MS = 1680;      // Luxury hold (~1.68s) so user admires the crystallized emblem and specular gleam
        var MAX_SAFETY_MS = 3800;      // Safety timeout before forcing handoff
        var isCriticalReady = false;
        var isHandoffStarted = false;
        var handoffAttempts = 0;
        var MAX_HANDOFF_ATTEMPTS = 200;

        function checkAndTriggerHandoff() {
          var elapsed = Date.now() - startTime;
          if (elapsed >= MIN_VISUAL_MS && isCriticalReady) {
            triggerHandoff();
          } else if (isCriticalReady) {
            setTimeout(function() {
              triggerHandoff();
            }, Math.max(0, MIN_VISUAL_MS - elapsed));
          }
        }

        // Dismiss immediately if user initiates scroll gesture during startup
        window.addEventListener('scroll', function onEarlyScroll() {
          window.removeEventListener('scroll', onEarlyScroll);
          if (!isHandoffStarted) {
            fallbackDismiss();
          }
        }, { passive: true, once: true });

        function fallbackDismiss() {
          if (isHandoffStarted) return;
          isHandoffStarted = true;
          state.status = 'REVEALED';

          var container = document.getElementById('lpu-startup-logo-container');
          var backdrop = document.getElementById('lpu-startup-backdrop');
          var shell = document.getElementById('lpu-startup-shell');
          var navEl = document.getElementById('navbar-brand-logo');

          if (navEl) navEl.style.opacity = '1';

          if (container) {
            container.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95)';
          }
          if (backdrop) {
            backdrop.style.transition = 'opacity 0.25s ease, backdrop-filter 0.25s ease, -webkit-backdrop-filter 0.25s ease';
            backdrop.style.opacity = '0';
            backdrop.style.backdropFilter = 'blur(0px)';
            backdrop.style.webkitBackdropFilter = 'blur(0px)';
          }

          setTimeout(function() {
            if (navEl) navEl.style.opacity = '1';
            if (shell && shell.parentNode) {
              shell.parentNode.removeChild(shell);
            }
          }, 260);
        }

        var state = {
          isHome: true,
          status: 'INITIAL',
          dismiss: fallbackDismiss,
          notifyCriticalReady: function() {
            if (isCriticalReady) return;
            isCriticalReady = true;
            state.status = 'CRITICAL_READY';
            checkAndTriggerHandoff();
          }
        };
        window.__LPU_STARTUP__ = state;

        function triggerHandoff() {
          if (isHandoffStarted) return;

          var container = document.getElementById('lpu-startup-logo-container');
          var backdrop = document.getElementById('lpu-startup-backdrop');
          var navEl = document.getElementById('navbar-brand-logo');

          if (!container) {
            fallbackDismiss();
            return;
          }

          // If user scrolled down before handoff, skip FLIP translation to prevent coordinate displacement
          if (window.scrollY > 20) {
            fallbackDismiss();
            return;
          }

          if (!navEl) {
            handoffAttempts++;
            if (handoffAttempts > MAX_HANDOFF_ATTEMPTS || (Date.now() - startTime) > MAX_SAFETY_MS) {
              fallbackDismiss();
            } else {
              requestAnimationFrame(triggerHandoff);
            }
            return;
          }

          var navRect = navEl.getBoundingClientRect();
          if (navRect.width === 0 || navRect.height === 0) {
            handoffAttempts++;
            if (handoffAttempts > MAX_HANDOFF_ATTEMPTS || (Date.now() - startTime) > MAX_SAFETY_MS) {
              fallbackDismiss();
            } else {
              requestAnimationFrame(triggerHandoff);
            }
            return;
          }

          isHandoffStarted = true;
          state.status = 'LOGO_HANDOFF';

          // Hide destination navbar logo while traveling logo is in flight
          navEl.style.opacity = '0';

          var startRect = container.getBoundingClientRect();
          var deltaX = navRect.left - startRect.left;
          var deltaY = navRect.top - startRect.top;
          var targetScale = navRect.width / (startRect.width || 1);

          // Clear CSS keyframe animation so it cannot override inline transform
          container.style.animation = 'none';
          void container.offsetWidth;

          // Smooth, cinematic shared-element FLIP transition into navbar slot (Act IV: 0.56s)
          container.style.transformOrigin = 'top left';
          container.style.transition = 'transform 0.56s cubic-bezier(0.22, 1, 0.36, 1)';
          container.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(' + targetScale + ')';

          // Fade out blur backdrop as logo approaches docked position (starts 180ms into flight)
          setTimeout(function() {
            if (backdrop) {
              backdrop.style.transition = 'opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1), backdrop-filter 0.38s ease, -webkit-backdrop-filter 0.38s ease';
              backdrop.style.opacity = '0';
              backdrop.style.backdropFilter = 'blur(0px)';
              backdrop.style.webkitBackdropFilter = 'blur(0px)';
            }
          }, 180);

          // Clean handoff to real navbar logo
          setTimeout(function() {
            state.status = 'REVEALED';
            if (navEl) navEl.style.opacity = '1';
            var s = document.getElementById('lpu-startup-shell');
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 560);
        }

        // Hard safety timeout so slow networks or late APIs never block the site indefinitely
        setTimeout(function() {
          if (!isHandoffStarted) {
            isCriticalReady = true;
            checkAndTriggerHandoff();
          }
        }, MAX_SAFETY_MS);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
