    <!-- Default Theme Initialization (Light Mode Default) -->
    <script>
      (function() {
        try {
          var initialized = localStorage.getItem('theme_initialized_v2');
          if (!initialized) {
            localStorage.setItem('theme_initialized_v2', 'true');
            localStorage.setItem('theme', 'light');
            document.documentElement.classList.remove('dark');
            return;
          }
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

      }

    <!-- Startup Readiness Coordinator Script -->
    <script>
      (function() {
        var path = window.location.pathname.toLowerCase();
        var isHome = path === '/' || path === '' || window.location.search.indexOf('page=home') !== -1;
        var shell = document.getElementById('lpu-startup-shell');

        // Non-homepage routes (about, privacy, terms, event-details) skip startup shell completely
        if (!isHome) {
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
          window.__LPU_STARTUP__ = {
            isHome: false,
            status: 'REVEALED',
            notifyCriticalReady: function() {}
          };
          return;
        }

        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
          window.__LPU_STARTUP__ = {
            isHome: true,
            status: 'REVEALED',
            notifyCriticalReady: function() {}
          };
          return;
        }

        var startTime = Date.now();
        var MIN_VISUAL_MS = 950;
        var MAX_SAFETY_MS = 3800;
        var isCriticalReady = false;
        var isHandoffStarted = false;

        var state = {
          isHome: true,
          status: 'INITIAL',
          notifyCriticalReady: function() {
            if (isCriticalReady) return;
            isCriticalReady = true;
            state.status = 'CRITICAL_READY';
            checkAndTriggerHandoff();
          }
        };
        window.__LPU_STARTUP__ = state;

        function triggerHandoff() {
          if (isHandoffStarted) return;

          var container = document.getElementById('lpu-startup-logo-container');
          var backdrop = document.getElementById('lpu-startup-backdrop');
          var navEl = document.getElementById('navbar-brand-logo');

          if (!container) return;

          if (!navEl) {
            requestAnimationFrame(function() {
              triggerHandoff();
            });
            return;
          }

          var navRect = navEl.getBoundingClientRect();
          if (navRect.width === 0 || navRect.height === 0) {
            requestAnimationFrame(function() {
              triggerHandoff();
            });
            return;
          }

          isHandoffStarted = true;
          state.status = 'LOGO_HANDOFF';

          // Hide destination navbar logo while traveling logo is in flight
          navEl.style.opacity = '0';

          var startRect = container.getBoundingClientRect();
          var deltaX = navRect.left - startRect.left;
          var deltaY = navRect.top - startRect.top;
          var targetScale = navRect.width / startRect.width;

          // Clear CSS keyframe animation so it cannot override inline transform
          container.style.animation = 'none';
          void container.offsetWidth;

          // Smooth shared-element FLIP transition into navbar slot
          container.style.transformOrigin = 'top left';
          container.style.transition = 'transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), filter 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
          container.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(' + targetScale + ')';
          container.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.18))';

          // Fade out blur backdrop as logo approaches docked position
          setTimeout(function() {
            if (backdrop) {
              backdrop.style.transition = 'opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 0.35s ease, -webkit-backdrop-filter 0.35s ease';
              backdrop.style.opacity = '0';
              backdrop.style.backdropFilter = 'blur(0px)';
              backdrop.style.webkitBackdropFilter = 'blur(0px)';
            }
          }, 420);

          // Clean handoff to real navbar logo
          setTimeout(function() {
            state.status = 'REVEALED';
            if (navEl) navEl.style.opacity = '1';
            var s = document.getElementById('lpu-startup-shell');
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 780);
        }

        function checkAndTriggerHandoff() {
          var elapsed = Date.now() - startTime;
          if (elapsed >= MIN_VISUAL_MS && isCriticalReady) {
            triggerHandoff();
          } else if (isCriticalReady) {
            setTimeout(function() {
              triggerHandoff();
            }, Math.max(0, MIN_VISUAL_MS - elapsed));
          }
        }

        setTimeout(function() {
          if (!isHandoffStarted) {
            isCriticalReady = true;
            triggerHandoff();
          }
        }, MAX_SAFETY_MS);
      })();
    </script>
