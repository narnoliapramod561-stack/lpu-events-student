    <!-- Default Theme Initialization (Light Mode Default) -->
    <script>
      (function() {
        try {
          var initialized = localStorage.getItem('theme_initialized_v2');
          if (!initialized) {
            localStorage.setItem('theme_initialized_v2', 'true');
            localStorage.setItem('theme', 'light');
            document.documentElement.classList.remove('dark');
            return;
          }
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Ultra-Low Latency Early Edge Prefetch: runs in parallel with JS downloading -->
    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase();
          var isHome = p === '/' || p === '' || window.location.search.indexOf('page=home') !== -1;
          if (isHome) {
            window.__PREFETCHED_HOMEPAGE__ = fetch('/api/public/homepage', {
              headers: { 'Accept': 'application/json' }
            }).then(function(res) {
              return res.ok ? res.json() : null;
            }).then(function(data) {
              if (data) {
                try {
                  var firstSlide = (data.carousel && data.carousel[0]) || (data.featured && data.featured[0]);
                  var imgUrl = null;
                  if (firstSlide) {
                    var evt = firstSlide.events || firstSlide;
                    var mediaId = evt.banner_media_id || (evt.media_assets && evt.media_assets.id);
                    if (mediaId) {
                      imgUrl = 'https://images.lpuevents.live/public-content/' + mediaId + '.webp';
                    } else if (firstSlide.custom_image_url) {
                      imgUrl = firstSlide.custom_image_url;
                    }
                  }
                  if (imgUrl) {
                    var preloadImg = new Image();
                    if ('fetchPriority' in preloadImg) preloadImg.fetchPriority = 'high';
                    preloadImg.src = imgUrl;
                  }
                } catch(e) {}
              }
              return data;
            }).catch(function() { return null; });
          }
        } catch(e) {}
      })();
    </script>

    <!-- Startup Readiness Coordinator Script -->
    <script>
      (function() {
        var path = window.location.pathname.toLowerCase();
        var isHome = path === '/' || path === '' || window.location.search.indexOf('page=home') !== -1;
        var shell = document.getElementById('lpu-startup-shell');

        // Non-homepage routes (about, privacy, terms, event-details) skip startup shell completely
        if (!isHome) {
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
          window.__LPU_STARTUP__ = {
            isHome: false,
            status: 'REVEALED',
            notifyCriticalReady: function() {}
          };
          return;
        }

        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
          window.__LPU_STARTUP__ = {
            isHome: true,
            status: 'REVEALED',
            notifyCriticalReady: function() {}
          };
          return;
        }

        var startTime = Date.now();
        // High-Velocity Brand Assembly:
        // Always display the full, fluid logo animation on every reload before docking into navbar.
        var MIN_VISUAL_MS = 650;
        var MAX_SAFETY_MS = 1600;
        var isCriticalReady = false;
        var isHandoffStarted = false;
        var handoffAttempts = 0;
        var MAX_HANDOFF_ATTEMPTS = 50;

        function fallbackDismiss() {
          if (isHandoffStarted) return;
          isHandoffStarted = true;
          state.status = 'REVEALED';

          var container = document.getElementById('lpu-startup-logo-container');
          var backdrop = document.getElementById('lpu-startup-backdrop');
          var shell = document.getElementById('lpu-startup-shell');

          if (container) {
            container.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95)';
          }
          if (backdrop) {
            backdrop.style.transition = 'opacity 0.25s ease, backdrop-filter 0.25s ease, -webkit-backdrop-filter 0.25s ease';
            backdrop.style.opacity = '0';
            backdrop.style.backdropFilter = 'blur(0px)';
            backdrop.style.webkitBackdropFilter = 'blur(0px)';
          }

          setTimeout(function() {
            if (shell && shell.parentNode) {
              shell.parentNode.removeChild(shell);
            }
          }, 260);
        }

        var state = {
          isHome: true,
          status: 'INITIAL',
          dismiss: fallbackDismiss,
          notifyCriticalReady: function() {
            if (isCriticalReady) return;
            isCriticalReady = true;
            state.status = 'CRITICAL_READY';
            checkAndTriggerHandoff();
          }
        };
        window.__LPU_STARTUP__ = state;

        function triggerHandoff() {
          if (isHandoffStarted) return;

          var container = document.getElementById('lpu-startup-logo-container');
          var backdrop = document.getElementById('lpu-startup-backdrop');
          var navEl = document.getElementById('navbar-brand-logo');

          if (!container) {
            fallbackDismiss();
            return;
          }

          if (!navEl) {
            handoffAttempts++;
            if (handoffAttempts > MAX_HANDOFF_ATTEMPTS || (Date.now() - startTime) > MAX_SAFETY_MS) {
              fallbackDismiss();
            } else {
              requestAnimationFrame(triggerHandoff);
            }
            return;
          }

          var navRect = navEl.getBoundingClientRect();
          if (navRect.width === 0 || navRect.height === 0) {
            handoffAttempts++;
            if (handoffAttempts > MAX_HANDOFF_ATTEMPTS || (Date.now() - startTime) > MAX_SAFETY_MS) {
              fallbackDismiss();
            } else {
              requestAnimationFrame(triggerHandoff);
            }
            return;
          }

          isHandoffStarted = true;
          state.status = 'LOGO_HANDOFF';

          // Hide destination navbar logo while traveling logo is in flight
          navEl.style.opacity = '0';

          var startRect = container.getBoundingClientRect();
          var deltaX = navRect.left - startRect.left;
          var deltaY = navRect.top - startRect.top;
          var targetScale = navRect.width / (startRect.width || 1);

          // Clear CSS keyframe animation so it cannot override inline transform
          container.style.animation = 'none';
          void container.offsetWidth;

          // Smooth, cinematic shared-element FLIP transition into navbar slot
          container.style.transformOrigin = 'top left';
          container.style.transition = 'transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), filter 0.38s cubic-bezier(0.22, 1, 0.36, 1)';
          container.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(' + targetScale + ')';
          container.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.18))';

          // Fade out blur backdrop as logo approaches docked position
          setTimeout(function() {
            if (backdrop) {
              backdrop.style.transition = 'opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), backdrop-filter 0.28s ease, -webkit-backdrop-filter 0.28s ease';
              backdrop.style.opacity = '0';
              backdrop.style.backdropFilter = 'blur(0px)';
              backdrop.style.webkitBackdropFilter = 'blur(0px)';
            }
          }, 100);

          // Clean handoff to real navbar logo
          setTimeout(function() {
            state.status = 'REVEALED';
            if (navEl) navEl.style.opacity = '1';
            var s = document.getElementById('lpu-startup-shell');
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 390);
        }

        function checkAndTriggerHandoff() {
          var elapsed = Date.now() - startTime;
          if (elapsed >= MIN_VISUAL_MS && isCriticalReady) {
            triggerHandoff();
          } else if (isCriticalReady) {
            setTimeout(function() {
              triggerHandoff();
            }, Math.max(0, MIN_VISUAL_MS - elapsed));
          }
        }

        setTimeout(function() {
          if (!isHandoffStarted) {
            isCriticalReady = true;
            if (document.getElementById('navbar-brand-logo')) {
              triggerHandoff();
            } else {
              fallbackDismiss();
            }
          }
        }, MAX_SAFETY_MS);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
